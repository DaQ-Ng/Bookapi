<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
  </defs>

  <rect width="900" height="800" fill="#ffffff"/>
  <text x="450" y="18" text-anchor="middle" font-size="13" fill="#666">How one request flows through the bookapi</text>

  <!-- Client -->
  <rect x="250" y="30" width="300" height="50" rx="8" fill="#f2f2f2" stroke="#555" stroke-width="1.5"/>
  <text x="400" y="52" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Client (curl / browser)</text>
  <text x="400" y="70" text-anchor="middle" font-size="12" fill="#555">PUT /books/1  +  JSON body</text>

  <!-- Spring group -->
  <rect x="200" y="105" width="400" height="315" rx="12" fill="#eef7e9" stroke="#6db33f" stroke-width="2"/>
  <text x="215" y="127" font-size="13" font-weight="bold" fill="#3d7a1c">SPRING DOES THIS</text>
  <text x="585" y="127" font-size="12" fill="#3d7a1c" text-anchor="end">(you set it up with annotations)</text>

  <rect x="230" y="140" width="340" height="70" rx="8" fill="#fff" stroke="#6db33f" stroke-width="1.5"/>
  <text x="245" y="163" font-size="15" font-weight="bold" fill="#222">1. Routing</text>
  <text x="245" y="183" font-size="12" fill="#444">"PUT /books/{id}? → that's updateBook()"</text>
  <text x="245" y="200" font-size="12" fill="#3d7a1c" font-family="Consolas, monospace">@PutMapping  @PathVariable</text>

  <rect x="230" y="235" width="340" height="70" rx="8" fill="#fff" stroke="#6db33f" stroke-width="1.5"/>
  <text x="245" y="258" font-size="15" font-weight="bold" fill="#222">2. Jackson (JSON → object)</text>
  <text x="245" y="278" font-size="12" fill="#444">new Book(), then a setter for each JSON key</text>
  <text x="245" y="295" font-size="12" fill="#3d7a1c" font-family="Consolas, monospace">@RequestBody</text>

  <rect x="230" y="330" width="340" height="70" rx="8" fill="#fff" stroke="#6db33f" stroke-width="1.5"/>
  <text x="245" y="353" font-size="15" font-weight="bold" fill="#222">3. Validation (checkpoint)</text>
  <text x="245" y="373" font-size="12" fill="#444">checks the rules on the finished Book</text>
  <text x="245" y="390" font-size="12" fill="#3d7a1c" font-family="Consolas, monospace">@Valid → @NotBlank @Min @Max</text>

  <!-- Your code group -->
  <rect x="200" y="450" width="400" height="320" rx="12" fill="#ebf1fb" stroke="#3b6fd8" stroke-width="2"/>
  <text x="215" y="472" font-size="13" font-weight="bold" fill="#244a99">YOUR CODE</text>

  <rect x="230" y="485" width="340" height="70" rx="8" fill="#fff" stroke="#3b6fd8" stroke-width="1.5"/>
  <text x="245" y="508" font-size="15" font-weight="bold" fill="#222">4. Controller — BookController</text>
  <text x="245" y="528" font-size="12" fill="#444">HTTP stuff: calls the service, picks status codes</text>
  <text x="245" y="545" font-size="12" fill="#244a99" font-family="Consolas, monospace">@RestController</text>

  <rect x="230" y="580" width="340" height="70" rx="8" fill="#fff" stroke="#3b6fd8" stroke-width="1.5"/>
  <text x="245" y="603" font-size="15" font-weight="bold" fill="#222">5. Service — BookService</text>
  <text x="245" y="623" font-size="12" fill="#444">the logic: find / add / update / delete</text>
  <text x="245" y="640" font-size="12" fill="#244a99" font-family="Consolas, monospace">@Service  (injected via constructor)</text>

  <rect x="230" y="675" width="340" height="70" rx="8" fill="#fff" stroke="#3b6fd8" stroke-width="1.5"/>
  <text x="245" y="698" font-size="15" font-weight="bold" fill="#222">6. Data</text>
  <text x="245" y="718" font-size="12" fill="#444">ArrayList&lt;Book&gt; in memory (wiped on restart)</text>
  <text x="245" y="735" font-size="12" fill="#888" font-style="italic">later: PostgreSQL + JPA repository</text>

  <!-- Main flow arrows -->
  <line x1="400" y1="80" x2="400" y2="138" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="210" x2="400" y2="233" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="305" x2="400" y2="328" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="400" x2="400" y2="483" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="440" font-size="12" fill="#3d7a1c" font-weight="bold">✔ all rules pass</text>
  <line x1="400" y1="555" x2="400" y2="578" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="650" x2="400" y2="673" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Error branches -->
  <rect x="640" y="235" width="235" height="70" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="655" y="258" font-size="15" font-weight="bold" fill="#c62828">400 Bad Request</text>
  <text x="655" y="277" font-size="12" fill="#444">broken JSON, or a setter threw</text>
  <text x="655" y="294" font-size="12" fill="#444">→ your code never runs</text>
  <line x1="570" y1="270" x2="638" y2="270" stroke="#c62828" stroke-width="2" marker-end="url(#arrowRed)"/>

  <rect x="640" y="330" width="235" height="70" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="655" y="353" font-size="15" font-weight="bold" fill="#c62828">400 Bad Request</text>
  <text x="655" y="372" font-size="12" fill="#444">a rule failed (e.g. no author)</text>
  <text x="655" y="389" font-size="12" fill="#444">→ your code never runs</text>
  <line x1="570" y1="365" x2="638" y2="365" stroke="#c62828" stroke-width="2" marker-end="url(#arrowRed)"/>

  <rect x="640" y="485" width="235" height="70" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
  <text x="655" y="508" font-size="15" font-weight="bold" fill="#c62828">404 Not Found</text>
  <text x="655" y="527" font-size="12" fill="#444">service returned null</text>
  <text x="655" y="544" font-size="12" fill="#444">→ ResponseStatusException</text>
  <line x1="570" y1="520" x2="638" y2="520" stroke="#c62828" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Response path -->
  <path d="M230,520 L120,520 L120,55 L248,55" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="105" y="290" font-size="12" fill="#444" text-anchor="middle" transform="rotate(-90 105 290)">200 OK: returned Book → Jackson → JSON → client</text>

  <!-- Legend -->
  <text x="20" y="790" font-size="11" fill="#666">Uncaught exception from your own code (e.g. NullPointerException) → 500 Internal Server Error</text>
</svg>
