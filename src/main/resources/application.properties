spring.application.name=bookapi

# ${NAME:default} = use the env var NAME if it's set, otherwise the default after the colon.
# Locally nothing changes; Docker and Render set these to point at their own database.
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookdb}
spring.datasource.username=${DB_USERNAME:bookuser}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
