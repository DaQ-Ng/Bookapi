<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book Marketplace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Book Marketplace</h1>
        <div id="who">Not logged in</div>
        <button id="logout-btn" hidden>Log out</button>
    </header>

    <!-- shows API errors and success messages -->
    <div id="message" hidden></div>

    <main>
        <!-- 1. Browse + search: public, no token needed -->
        <section>
            <h2>Books for sale</h2>
            <form id="search-form">
                <input id="search-title" placeholder="Search by title">
                <button>Search</button>
            </form>
            <ul id="book-list"></ul>
            <div class="pager">
                <button id="prev-btn">Previous</button>
                <span id="page-info"></span>
                <button id="next-btn">Next</button>
            </div>
        </section>

        <!-- 2. Login / register: shown only when logged out -->
        <section id="auth-section">
            <h2>Log in</h2>
            <form id="login-form">
                <input id="login-email" type="email" placeholder="Email" required>
                <input id="login-password" type="password" placeholder="Password" required>
                <button>Log in</button>
            </form>
            <h2>New here? Register</h2>
            <form id="register-form">
                <input id="reg-name" placeholder="Name" required>
                <input id="reg-email" type="email" placeholder="Email" required>
                <input id="reg-password" type="password" placeholder="Password" required>
                <button>Register</button>
            </form>
        </section>

        <!-- 3. Sell + my orders: shown only when logged in -->
        <section id="member-section" hidden>
            <h2>Sell a book</h2>
            <form id="sell-form">
                <input id="sell-title" placeholder="Title" required>
                <input id="sell-author" placeholder="Author" required>
                <input id="sell-year" type="number" placeholder="Year" required>
                <input id="sell-price" type="number" step="0.01" placeholder="Price" required>
                <button>List it</button>
            </form>

            <h2>My orders</h2>
            <ul id="order-list"></ul>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
